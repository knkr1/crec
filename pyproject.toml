[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "crec"
version = "2.1.0"
description = "yt-dlp + ffmpeg with a clipboard. Download, trim, shrink, paste."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [{ name = "knkr1" }]
keywords = ["yt-dlp", "ffmpeg", "download", "clipboard", "video"]
classifiers = [
    "Environment :: Console",
    "License :: OSI Approved :: MIT License",
    "Operating System :: Microsoft :: Windows",
    "Operating System :: MacOS",
    "Programming Language :: Python :: 3",
]

# ffmpeg is fetched at runtime (never redistributed, so its GPL never becomes our
# problem) and the clipboard is pure ctypes.
#
# yt-dlp's own recommended extras, though, are not optional in practice:
# - default:   mutagen, brotli, websockets, pycryptodomex, ... - plain "yt-dlp"
#              has none, and the frozen build silently shipped without them.
# - curl-cffi: browser impersonation. TikTok answers anything that doesn't look
#              like a real browser with a bot-challenge page, and the download
#              fails with "Unexpected response from webpage request".
dependencies = ["yt-dlp[default,curl-cffi]>=2025.1.1"]

[project.urls]
Homepage = "https://github.com/knkr1/crec"

[project.scripts]
crec = "crec.cli:main"

[tool.setuptools.packages.find]
include = ["crec*"]

[tool.setuptools.package-data]
crec = ["presets.toml", "assets/*.ico"]

[tool.pytest.ini_options]
markers = ["ffmpeg: runs a real ffmpeg (skipped when it is not installed)"]
