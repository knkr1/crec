name: release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  windows-exe:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - run: |
          python -m pip install --upgrade pip
          pip install -e . pyinstaller
      - run: pyinstaller crec.spec --noconfirm
      - name: Verify before publishing
        run: |
          .\dist\crec\crec.exe --version
          .\dist\crec\crec.exe presets
          if (-not (Test-Path .\dist\crec\crecw.exe)) { throw "crecw.exe missing" }
      - name: Zip and checksum
        id: sum
        run: |
          Compress-Archive -Path dist\crec\* -DestinationPath crec-windows-x64.zip
          $hash = (Get-FileHash crec-windows-x64.zip -Algorithm SHA256).Hash
          "$hash  crec-windows-x64.zip" | Out-File -FilePath crec-windows-x64.zip.sha256 -Encoding ascii
          echo "sha256=$hash" >> $env:GITHUB_OUTPUT
      - uses: softprops/action-gh-release@v2
        with:
          files: |
            crec-windows-x64.zip
            crec-windows-x64.zip.sha256
          body: |
            **Windows:** paste this into PowerShell. It installs crec (no Python needed),
            puts it on your PATH, and offers to turn on the hotkeys:

            ```powershell
            irm https://raw.githubusercontent.com/knkr1/crec/main/install.ps1 | iex
            ```

            Already have crec 2.1 or newer? Run `crec update`.

            **Anywhere else:** `pipx install crec`

            SHA256 (`crec-windows-x64.zip`): `${{ steps.sum.outputs.sha256 }}`
          generate_release_notes: true

  pypi:
    runs-on: ubuntu-latest
    # Uses the PYPI_API_TOKEN secret that v1 already had configured. This job
    # replaces v1's separate publish.yml, which triggered on `release: created`
    # - that would never fire here, because a release created by a workflow's
    # GITHUB_TOKEN does not trigger further workflows.
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - run: |
          python -m pip install --upgrade pip build twine
          python -m build
      - name: Publish
        env:
          TWINE_USERNAME: __token__
          TWINE_PASSWORD: ${{ secrets.PYPI_API_TOKEN }}
        run: twine upload dist/*
