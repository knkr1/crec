name: ci

on:
  push:
    branches: [main, master]
  pull_request:

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, ubuntu-latest, macos-latest]
        python: ["3.11", "3.13"]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - name: Install
        run: |
          python -m pip install --upgrade pip
          pip install -e . pytest
      - name: Test
        # The suite is deliberately network-free and ffmpeg-free, so it runs
        # everywhere without setup.
        run: pytest tests -q
      - name: Smoke-test the CLI
        run: |
          crec --version
          crec presets
          crec presets --keys

  build:
    name: build exe
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - run: |
          python -m pip install --upgrade pip
          pip install -e . pyinstaller
      - run: pyinstaller crec.spec --noconfirm
      - name: Verify the frozen build actually runs
        run: |
          .\dist\crec\crec.exe --version
          .\dist\crec\crec.exe presets
          if (-not (Test-Path .\dist\crec\crecw.exe)) { throw "crecw.exe missing" }
      - run: Compress-Archive -Path dist\crec\* -DestinationPath crec-windows-x64.zip
      - uses: actions/upload-artifact@v4
        with:
          name: crec-windows-x64
          path: crec-windows-x64.zip
