name: ci

on:
  push:
    branches: [main, master]
  pull_request:

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, ubuntu-latest, macos-latest]
        python: ["3.11", "3.13"]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - name: Install
        run: |
          python -m pip install --upgrade pip
          pip install -e . pytest
      - name: Test
        # Network-free. The real-ffmpeg tests skip themselves on runners
        # without ffmpeg; the `ffmpeg` job below makes sure they always run once.
        run: pytest tests -q
      - name: Smoke-test the CLI
        run: |
          crec --version
          crec presets
          crec presets --keys

  ffmpeg:
    name: real ffmpeg
    # The bugs that hurt most were ffmpeg rejecting crec's arguments, which the
    # faked-ffmpeg unit tests cannot see. Run the encode paths for real.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - run: sudo apt-get update && sudo apt-get install -y ffmpeg
      - run: |
          python -m pip install --upgrade pip
          pip install -e . pytest
      - name: Encode paths
        # -rs lists skips, and the grep fails the job if any were skipped:
        # silently skipping everything here would defeat the point.
        run: |
          pytest tests/test_ffmpeg.py -v -rs | tee ffmpeg-tests.log
          ! grep -q "SKIPPED" ffmpeg-tests.log

  build:
    name: build exe
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - run: |
          python -m pip install --upgrade pip
          pip install -e . pyinstaller
      - run: pyinstaller crec.spec --noconfirm
      - name: Verify the frozen build actually runs
        run: |
          .\dist\crec.exe --version
          .\dist\crec.exe presets
      - uses: actions/upload-artifact@v4
        with:
          name: crec-exe
          path: dist/crec.exe
